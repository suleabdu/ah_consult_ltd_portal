<!DOCTYPE html>
<!--
  staff-login
  AH Student Hub — shared login page for Tutor and Admin. Ported from
  StaffLogin.html.

  ADAPTATION: the ID Generation document (Section 1.1.5) makes the Tutor
  ID the tutor's own email address, replacing the old "Tutor Code" login
  field — so both tabs here now collect an email address (previously only
  the Admin tab did). See docs/ARCHITECTURE_AND_DECISIONS.md.

  SIMPLIFICATION vs. the original: see the identical note in
  student-login re: the iframe-navigation workaround no longer being
  needed on static Netlify hosting.
-->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login — AH Student Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/ah-design-system.css">
</head>

<body class="ahds">

  <div id="app-wrapper" class="relative min-h-screen flex items-center justify-center bg-gray-900 py-10 px-4">
    <div class="absolute inset-0 z-0 hero-bg">
      <img src="https://lh3.googleusercontent.com/d/1j4e1Rx5igtD7_4GTuVhz7WlQ3lCyrF68" alt=""
        class="w-full h-full object-cover opacity-30">
    </div>

    <div
      class="main-container relative z-10 w-full max-w-md bg-gray-100/95 backdrop-blur-md rounded-xl shadow-2xl overflow-hidden border border-gray-300 p-8">

      <a href="/" class="text-xs font-bold text-gray-500 hover:text-orange-600 mb-4 inline-flex items-center gap-1">&larr; Back to Home</a>

      <div class="text-center mb-6">
        <h1 class="text-2xl font-extrabold theme-accent tracking-wide">AH STUDENT HUB</h1>
        <p class="text-gray-500 text-sm mt-1 uppercase tracking-wider">Staff Login</p>
      </div>

      <div id="loginPanel">

        <div class="grid grid-cols-2 gap-2 mb-6">
          <button type="button" id="tab-tutor" onclick="selectRole('tutor', this)"
            class="role-tab theme-bg-accent text-white font-bold py-2 rounded-lg text-sm uppercase tracking-wide transition-colors">Tutor</button>
          <button type="button" id="tab-admin" onclick="selectRole('admin', this)"
            class="role-tab bg-gray-200 text-gray-600 font-bold py-2 rounded-lg text-sm uppercase tracking-wide transition-colors">Admin</button>
        </div>

        <div id="errorBox" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3 mb-4"></div>

        <label id="identifierLabel" class="block text-sm font-bold text-gray-700 mb-1">Email</label>
        <input type="text" id="identifier" placeholder="you@example.com" class="input-light p-3 rounded-lg w-full mb-4">

        <label class="block text-sm font-bold text-gray-700 mb-1">Password</label>
        <input type="password" id="password" placeholder="Enter your password" class="input-light p-3 rounded-lg w-full mb-2">

        <div class="text-right mb-5">
          <a href="forgot-password.html?role=staff" class="text-sm theme-accent font-semibold hover:underline">Forgot password?</a>
        </div>

        <button type="button" id="loginBtn" onclick="doLogin()"
          class="theme-bg-accent hover:bg-orange-600 text-white font-bold py-3 rounded-lg w-full uppercase tracking-wide shadow-lg transition-all flex items-center justify-center gap-2">
          <span id="loginBtnText">Log In</span>
          <div id="loginLoader" class="loader hidden ease-linear rounded-full border-2 border-t-2 border-gray-200 h-4 w-4"></div>
        </button>

        <p class="text-center text-xs text-gray-400 mt-6">
          Student? <a href="student-login.html" class="text-gray-500 font-semibold hover:underline">Student login</a>
        </p>
      </div>

      <div id="profilePanel" class="hidden">
        <h2 class="text-lg font-bold text-gray-800 mb-1">Complete Your Tutor Profile</h2>
        <p class="text-sm text-gray-500 mb-5">We don't have your name on file yet — let's fix that before you continue.</p>

        <div id="profileErrorBox" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3 mb-4"></div>

        <input type="text" id="profileName" placeholder="Full Name" class="input-light p-3 rounded-lg w-full mb-3">
        <input type="email" id="profileEmail" placeholder="Email Address" class="input-light p-3 rounded-lg w-full mb-3">

        <label class="block text-sm font-bold text-gray-700 mb-1">Passport Photo <span class="font-normal text-gray-400">(optional for now)</span></label>
        <input type="file" id="profilePhoto" accept="image/*"
          class="w-full text-gray-600 text-sm mb-5 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100">

        <button type="button" onclick="submitProfile()"
          class="theme-bg-accent hover:bg-orange-600 text-white font-bold py-3 rounded-lg w-full uppercase tracking-wide shadow-lg transition-all">
          Save & Continue
        </button>
      </div>

      <div id="successPanel" class="hidden text-center">
        <div class="text-5xl mb-4">✅</div>
        <h2 id="successHeading" class="text-xl font-bold text-gray-800 mb-2">Welcome, <span id="successName"></span>!</h2>
        <p id="successMessage" class="text-gray-600 mb-6">You're securely logged in.</p>
        <a id="continueBtn" href="#"
          class="theme-bg-accent hover:bg-orange-600 text-white font-bold py-3 px-8 rounded-lg uppercase tracking-wide shadow-lg inline-block transition-all">
          Continue &rarr;
        </a>
      </div>

    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    const ROLE_TUTOR = "tutor";
    const ROLE_ADMIN = "admin";
    let selectedRole = ROLE_TUTOR;
    let sessionToken = null;

    function selectRole(role, el) {
      selectedRole = role;
      document.querySelectorAll('.role-tab').forEach(function (b) {
        b.classList.remove('theme-bg-accent', 'text-white');
        b.classList.add('bg-gray-200', 'text-gray-600');
      });
      el.classList.remove('bg-gray-200', 'text-gray-600');
      el.classList.add('theme-bg-accent', 'text-white');
    }

    function showError(message) {
      const box = document.getElementById('errorBox');
      box.innerText = message;
      box.classList.remove('hidden');
    }
    function clearError() {
      document.getElementById('errorBox').classList.add('hidden');
    }

    function setLoading(isLoading) {
      document.getElementById('loginBtn').disabled = isLoading;
      document.getElementById('loginLoader').classList.toggle('hidden', !isLoading);
      document.getElementById('loginBtnText').innerText = isLoading ? 'Checking...' : 'Log In';
    }

    function doLogin() {
      clearError();
      const identifier = document.getElementById('identifier').value.trim();
      const password = document.getElementById('password').value;
      if (!identifier || !password) { showError('Please enter your email and password.'); return; }

      setLoading(true);
      Api.call('/api/auth/login', { identifier, password, role: selectedRole }, function (res) {
        setLoading(false);
        if (res.mustChangePassword) {
          sessionStorage.setItem('ahSetupActorId', res.actorId);
          sessionStorage.setItem('ahSetupRole', res.role);
          window.location.href = 'setup-password';
          return;
        }
        enterAfterLogin(res.token, res.displayName, res.role, res.needsProfile);
      }, function (err) {
        setLoading(false);
        showError(err.message || 'Something went wrong. Please try again.');
      });
    }

    function enterAfterLogin(token, name, role, needsProfile) {
      sessionToken = token;

      if (role === ROLE_TUTOR && needsProfile) {
        document.getElementById('loginPanel').classList.add('hidden');
        document.getElementById('profilePanel').classList.remove('hidden');
        return;
      }

      sessionStorage.setItem('ahSessionToken', token);
      sessionStorage.setItem('ahRole', role);
      sessionStorage.setItem('ahDisplayName', name);

      if (role === ROLE_ADMIN) {
        showContinue('admin-dashboard', name, 'Continue to Admin Dashboard \u2192');
      } else {
        showContinue('tutor', name, 'Continue to Your Portal \u2192');
      }
    }

    function showContinue(href, name, label) {
      document.getElementById('loginPanel').classList.add('hidden');
      document.getElementById('profilePanel').classList.add('hidden');
      if (name) document.getElementById('successName').innerText = name;
      const btn = document.getElementById('continueBtn');
      btn.href = href;
      btn.innerText = label;
      document.getElementById('successPanel').classList.remove('hidden');
      setTimeout(function () { window.location.href = href; }, 900);
    }

    function submitProfile() {
      const errBox = document.getElementById('profileErrorBox');
      errBox.classList.add('hidden');
      const name = document.getElementById('profileName').value.trim();
      const email = document.getElementById('profileEmail').value.trim();
      if (!name || !email) {
        errBox.innerText = 'Please fill in both your name and email.';
        errBox.classList.remove('hidden');
        return;
      }

      const file = document.getElementById('profilePhoto').files[0];
      function proceed(photoData) {
        Api.call('/api/auth/complete-tutor-profile', { token: sessionToken, name, email, photoData }, function (res) {
          sessionStorage.setItem('ahSessionToken', sessionToken);
          sessionStorage.setItem('ahRole', ROLE_TUTOR);
          sessionStorage.setItem('ahDisplayName', name);
          showContinue('tutor', name, 'Continue to Your Portal \u2192');
        }, function (err) {
          errBox.innerText = err.message || 'Something went wrong.';
          errBox.classList.remove('hidden');
        });
      }

      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) { proceed(e.target.result); };
        reader.readAsDataURL(file);
      } else {
        proceed(null);
      }
    }
  </script>

</body>

</html>
