<!DOCTYPE html>
<!--
  SETUP GUIDE  -  tutor  (Tutor Portal)
  WHAT IT IS: the workspace for approved tutors: dashboard, students and grading (CA, objectives, practical), lectures with
  downloadable materials, assignments with submission review and marking, exams, and student feedback.
  WHERE IT GOES: your site folder, next to staff-login.html. It needs these files beside it:
      css/portal.css   js/portal-core.js   js/config.js   js/theme.js
  DATABASE: run migrations 009_portals.sql and 010_settings.sql (Supabase SQL Editor, in order, after 001 to 008).
  NO SECRETS: only the public project URL and anon key from js/config.js are used. The database limits every tutor to
  their own courses, so a tutor can never see or grade a course they do not teach.
  HOW A TUTOR GETS HERE (3 steps):
      1. The tutor registers on admin-register choosing the position "Tutor / Lecturer" and an access code allowed for tutors.
      2. An Administrator approves them in Admin Dashboard > Team & Access (this links them to a lecturer record by email).
      3. An Administrator or Academic Coordinator assigns their courses in Admin Dashboard > Lecturers > Assign courses.
      They then sign in on staff-login and are sent here.
  TEST: sign in as an approved tutor with one assigned course; enrolled, admitted students appear under Students & Grades.
  PROBLEMS: "profile is not linked" = approve the tutor again in Team & Access. No students = the course has no admitted students yet.
-->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tutor Portal | AH Consult</title><meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portal.css"><link rel="stylesheet" href="css/ah-design-system.css">
</head>
<body class="ahds"><div id="root"><div class="gate">Loading your portal&hellip;</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/config.js"></script>
<script src="js/theme.js"></script>
<script src="js/portal-core.js"></script>
<script>
(async function () {
 const { esc, day, dt, toast, modal, band, bandPill } = PC, root = document.getElementById('root');
 let ctx; try { ctx = await PC.boot({ role: 'tutor', loginUrl: 'staff-login' }); } catch (e) { root.innerHTML = '<div class="gate">' + esc(e.message) + '</div>'; return; }
 if (!ctx) return; const { sb, user, staff } = ctx; let L = null, courses = [], taught = [], intakes = [], roster = [], lectures = [], assigns = [], exams = [], fb = [], subs = {}, ui, F = { c: '', i: '' };
 async function load() {
  const lr = await sb.from('lecturers').select('*').eq('user_id', user.id).maybeSingle(); L = lr.data; if (lr.error) throw new Error(lr.error.message + ' (run 009_portals.sql)'); if (!L) return;
  const [lc, cs, it, ro, le, as, ex, f] = await Promise.all([sb.from('lecturer_courses').select('course_code').eq('lecturer_id', L.id), sb.from('courses').select('code,name,category'), sb.from('intakes').select('id,label').order('opens_at', { ascending: false }), sb.rpc('tutor_roster'),
   sb.from('lectures').select('*').eq('lecturer_id', L.id).order('held_at', { ascending: false }), sb.from('assignments').select('*').eq('lecturer_id', L.id).order('issued_at', { ascending: false }), sb.from('exams').select('*').eq('lecturer_id', L.id).order('created_at', { ascending: false }), sb.rpc('tutor_feedback')]);
  courses = cs.data || []; taught = (lc.data || []).map(x => x.course_code); intakes = it.data || []; roster = ro.error ? [] : (ro.data || []); lectures = le.data || []; assigns = as.data || []; exams = ex.data || []; fb = f.data || [];
  subs = {}; await Promise.all(assigns.map(async a => { const r = await sb.rpc('tutor_submissions', { p_assignment: a.id }); subs[a.id] = r.error ? [] : (r.data || []); }));
 };
 const cname = c => { const x=courses.find(x=>x.code===c); return x ? x.name+' ('+x.category+')' : c; }, ilabel = i => (intakes.find(x => x.id === i) || {}).label || 'All intakes';
 const toGrade = () => Object.values(subs).reduce((n, l) => n + l.filter(s => s.graded_at == null).length, 0);
 const tbl = (h, rows) => `<div class="tw"><table class="rt"><thead><tr>${h.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length ? rows.join('') : `<tr><td colspan="${h.length}" style="text-align:center;color:#9ca3af;padding:24px">Nothing here yet.</td></tr>`}</tbody></table></div>`;
 const trow = (h, c, a = '') => `<tr ${a}>` + c.map((x, i) => `<td data-l="${h[i]}">${x}</td>`).join('') + '</tr>';
 const copts = () => taught.map(c => `<option value="${esc(c)}">${esc(cname(c))}</option>`).join(''), iopts = (all = true) => (all ? '<option value="">All intakes</option>' : '') + intakes.map(i => `<option value="${i.id}">${esc(i.label)}</option>`).join('');
 const noCourses = () => taught.length ? '' : '<div class="notice w">No courses are assigned to you yet. Ask an Administrator or the Academic Coordinator to assign your courses (Admin Dashboard, Lecturers).</div>';
 const V = {};
 V.dash = () => { const ids = new Set(roster.map(r => r.application_id)), r = fb.filter(x => x.rating), avg = r.length ? (r.reduce((s, x) => s + x.rating, 0) / r.length).toFixed(1) : '-';
  return `<h1>Dashboard</h1><p class="sub">Your courses: ${taught.length ? taught.map(c => `<b>${esc(cname(c))}</b>`).join(', ') : 'none assigned yet'}</p>${noCourses()}<div class="cards"><div class="card o"><small>Students</small><b>${ids.size}</b></div><div class="card"><small>Lectures</small><b>${lectures.length}</b></div><div class="card"><small>Assignments</small><b>${assigns.length}</b></div><div class="card"><small>To grade</small><b>${toGrade()}</b></div><div class="card"><small>Student rating</small><b>${avg}</b></div></div>
  <div class="panel"><h3>Needs attention</h3>${toGrade() ? `<p style="margin:0">${toGrade()} submission(s) are waiting to be graded. <button class="btn s" data-go="assign">Review</button></p>` : '<p class="sub" style="margin:0">Nothing is waiting for you.</p>'}</div><div class="panel"><h3>My Courses</h3><p class="sub">A quick operational view of each course assigned to you.</p><div class="cards">${taught.map(c=>{const rr=roster.filter(x=>x.course_code===c), pending=rr.filter(x=>!x.result||x.result.published_at==null).length, aa=assigns.filter(x=>x.course_code===c).length, ll=lectures.filter(x=>x.course_code===c).length;return `<div class="card"><small>${esc(cname(c))}</small><b>${rr.length} students</b><small style="margin-top:6px">${pending} results pending · ${aa} assignments · ${ll} lectures</small><button class="btn s" data-course-focus="${esc(c)}" style="margin-top:10px">Open course</button></div>`}).join('')}</div></div>`; };
 V.grades = () => {
  const rows=roster.filter(r=>(!F.c||r.course_code===F.c)&&(!F.i||r.intake_id===F.i)),H=['Student','Course','Attendance (40%)','CA (30%)','Exams (30%)','Total','Grade',''];
  const ints=[...new Map(roster.map(r=>[r.intake_id,r.intake_label]))];
  return `<h1>Students &amp; Grades</h1><div class="panel"><h3>Official grading model</h3><p class="sub" style="margin:0"><b>Attendance 40%</b> + <b>CA 30%</b> + <b>Exams 30%</b> = <b>100%</b>. The system validates each score and calculates the final total automatically.</p><p class="sub" style="margin:8px 0 0">Bulk Excel format: <b>Student ID, Course Code, Attendance, CA, Exams</b>. Attendance must be 0–40, CA 0–30 and Exams 0–30. Course Code must exactly match the course code shown in the portal. One student/course per row.</p><div class="row"><input type="file" id="bulkResults" accept=".xlsx,.xls,.csv"><button class="btn" id="bulkUpload">Import Excel results</button><span class="sp"></span><button class="btn" id="saveAll">Save all changes</button></div><div id="bulkMsg" class="sub"></div></div><div class="row" style="margin:0 0 12px"><select id="fc" style="max-width:260px"><option value="">All my courses</option>${taught.map(c=>`<option value="${esc(c)}" ${F.c===c?'selected':''}>${esc(cname(c))}</option>`).join('')}</select><select id="fi" style="max-width:220px"><option value="">All intakes</option>${ints.map(([id,l])=>`<option value="${id}" ${F.i===id?'selected':''}>${esc(l)}</option>`).join('')}</select></div>${tbl(H,rows.map(r=>{
   const x=r.result||{},legacy=x.grading_model==='legacy_ca_exam_obj_prac',needsReview=x.grading_model==='needs_review',requiresReentry=legacy||needsReview,protectedResult=!!(x.published_at||x.locked_at);
   const n=(k,v,max)=>`<input class="in sc" type="number" min="0" max="${max}" data-k="${k}" ${requiresReentry?'placeholder="Enter new score"':`value="${v==null?'':v}"`} ${protectedResult?'disabled':''} style="width:86px">`;
   const modelNote=legacy?`<br><small class="pill info">Legacy CA + Objective + Practical</small><br><small>Archived source components: CA ${x.ca??0}, Objective ${x.legacy_exam_obj??0}, Practical ${x.legacy_exam_prac??0}. Enter all three current-model scores to convert this record.</small>`:needsReview?`<br><small class="pill wait">Review required</small><br><small>This record cannot be safely classified from stored scores. Confirm the source record, then enter all three current-model scores explicitly. ${Number(x.legacy_exam_obj||0)||Number(x.legacy_exam_prac||0)?`Preserved legacy components: CA ${x.ca??0}, Objective ${x.legacy_exam_obj??0}, Practical ${x.legacy_exam_prac??0}.`:''}</small>`:'';
   const lockNote=protectedResult?'<br><small class="pill wait">Published / locked</small>':'';
   return trow(H,[`<b>${esc(r.name)}</b><br><small>${esc(r.student_id||'')} · ${esc(r.intake_label)}</small>${modelNote}${lockNote}`,esc(cname(r.course_code)),n('attendance',x.attendance,40),n('ca',x.ca,30),n('exams',x.exams,30),`<b class="tt">${r.result?x.total:'-'}</b>`,`<span class="bd">${r.result?bandPill(x.band):'<small>-</small>'}</span>`,protectedResult?'<button class="btn s sv" disabled title="Ask Academic to reopen this result for correction">Locked</button>':'<button class="btn s sv">Save</button>'],`data-app="${r.application_id}" data-course="${esc(r.course_code)}" data-legacy="${requiresReentry}" data-protected="${protectedResult}"`);
  }))}`;
 };
 V.lectures = () => `<h1>Lectures</h1><p class="sub">Publish lectures and materials for your students.</p>${noCourses()}<div class="panel"><h3>New lecture</h3><div class="grid"><input class="in" id="lt" placeholder="Lecture title"><select id="lc">${copts()}</select><select id="li">${iopts()}</select><input class="in" id="ld" type="date" value="${new Date().toISOString().slice(0, 10)}"></div><textarea id="lx" rows="2" placeholder="What this lecture covers" style="margin-top:8px"></textarea><label class="f">Material (optional, up to 10 MB)</label><input type="file" id="lf" class="in"><div class="row"><button class="btn" id="lgo" ${taught.length ? '' : 'disabled'}>Publish lecture</button></div></div>
  ${lectures.length ? lectures.map(l => `<div class="item"><div class="hd"><div><b>${esc(l.title)}</b> <span class="pill info">${esc(cname(l.course_code))}</span><p>${day(l.held_at)} &middot; ${esc(ilabel(l.intake_id))}</p>${l.description ? `<p>${esc(l.description)}</p>` : ''}</div><button class="btn s r" data-ldel="${l.id}">Delete</button></div></div>`).join('') : '<div class="notice i">No lectures published yet.</div>'}`;
 V.assign = () => `<h1>Assignments</h1><p class="sub">Build assignments professionally. Choose Online or Paper submission, require a file when needed, add as many questions as you like, or send students to an external link.</p>${noCourses()}<div class="panel"><h3>New assignment</h3><div class="grid"><input class="in" id="at" placeholder="Title"><select id="ac">${copts()}</select><select id="ai">${iopts()}</select><input class="in" id="ad" type="datetime-local"><input class="in" id="am" type="number" min="1" placeholder="Maximum marks"></div><div class="grid" style="margin-top:8px"><select id="asub"><option>Online</option><option>Paper</option></select><select id="afile"><option value="false">File required: No</option><option value="true">File required: Yes</option></select><input class="in" id="aurl" placeholder="External link (optional)"></div><textarea id="ax" rows="2" placeholder="Instructions"></textarea><div id="aqs"></div><div class="row"><button class="btn g" id="addAQ">+ Add question</button><button class="btn g" id="bulkAQ">Import questions from Excel/CSV</button><input type="file" id="aqFile" accept=".xlsx,.xls,.csv" hidden><button class="btn" id="ago" ${taught.length?'':'disabled'}>Create assignment</button></div><p class="sub">Question import format: <b>Question, Options, Mandatory, File Required</b>. Put multiple options in one cell separated by <b>|</b>; Mandatory and File Required must be Yes or No. One question per row.</p></div>${assigns.length?assigns.map(a=>{const ss=subs[a.id]||[],gr=ss.filter(x=>x.graded_at!=null).length;return `<div class="item"><div class="hd"><div><b>${esc(a.title)}</b> <span class="pill info">${esc(cname(a.course_code))}</span> ${a.closed?'<span class="pill none">Closed</span>':'<span class="pill ok">Open</span>'}<p>${a.submission_type||'Online'}${a.file_required?' · file required':''}${a.external_url?' · external link':''}${a.due_at?' · Due '+dt(a.due_at):''} · ${ss.length} submitted, ${gr} graded</p></div><div class="row"><button class="btn s" data-rev="${a.id}">Review (${ss.length})</button><button class="btn s g" data-tog="${a.id}">${a.closed?'Reopen':'Close'}</button><button class="btn s r" data-adel="${a.id}">Delete</button></div></div></div>`;}).join(''):'<div class="notice i">No assignments yet.</div>'}`;
 V.exams = () => `<h1>Exams</h1><p class="sub">Create timed or untimed exams. Students press Start Exam before the answer sheet opens; the system then controls the timer.</p>${noCourses()}<div class="panel"><h3>New exam</h3><div class="grid"><input class="in" id="et" placeholder="Exam title"><select id="ec">${copts()}</select><select id="ei">${iopts()}</select><input class="in" id="ed" type="datetime-local"></div><div class="grid" style="margin-top:8px"><input class="in" id="etime" type="number" min="1" placeholder="Special time allowed (minutes)"><select id="esub"><option>Online</option><option>Paper</option></select><select id="efile"><option value="false">File required: No</option><option value="true">File required: Yes</option></select><input class="in" id="eurl" placeholder="External link (optional)"></div><textarea id="ex" rows="2" placeholder="Exam instructions"></textarea><div id="eqs"></div><div class="row"><button class="btn g" id="addEQ">+ Add question</button><button class="btn g" id="bulkEQ">Import questions from Excel/CSV</button><input type="file" id="eqFile" accept=".xlsx,.xls,.csv" hidden><button class="btn" id="ego" ${taught.length?'':'disabled'}>Send exam</button></div><p class="sub">Question import format: <b>Question, Options, Mandatory</b>. Multiple options go in one cell separated by <b>|</b>. Mandatory must be Yes or No.</p></div>${exams.length?exams.map(e=>`<div class="item"><div class="hd"><div><b>${esc(e.title)}</b> <span class="pill info">${esc(cname(e.course_code))}</span><p>${e.submission_type||'Online'}${e.time_limit_minutes?' · '+e.time_limit_minutes+' min':''}${e.due_at?' · '+dt(e.due_at):''}</p></div><button class="btn s r" data-edel="${e.id}">Delete</button></div></div>`).join(''):'<div class="notice i">No exams yet.</div>'}`;
 V.fb = () => { const r=fb.filter(x=>x.rating),avg=r.length?(r.reduce((s,x)=>s+x.rating,0)/r.length).toFixed(1):'-';return `<h1>Student Feedback</h1><p class="sub">Feedback now includes the sender, course, category and intake so you can understand the context.</p><div class="cards"><div class="card o"><small>Average rating</small><b>${avg}</b></div><div class="card"><small>Ratings received</small><b>${r.length}</b></div></div>${fb.length?fb.map(x=>`<div class="item"><div class="hd"><div><b>${esc(x.student||'Student')}</b><p>${esc(x.student_id||'')} · ${esc(x.course_name||x.course_code||'-')} (${esc(x.course_category||'-')}) · ${esc(x.intake_label||'-')}</p></div><span>${x.rating?'&#9733;'.repeat(x.rating):'-'}</span></div><p>${esc(x.comment||'No written comment.')}</p><small>${dt(x.created_at)}</small></div>`).join(''):'<div class="notice i">No feedback yet.</div>'}`; };
 V.profile = () => `<h1>My Profile</h1><div class="panel"><b style="font-size:16px">${esc(staff.full_name)}</b><br><small>${esc(staff.email)} ${esc(staff.phone || '')}</small><div class="chips" style="margin-top:10px">${taught.map(c => `<span>${esc(cname(c))}</span>`).join('') || '<small>No courses assigned</small>'}</div><div class="row"><button class="btn g" id="pw">Send me a password reset link</button></div></div>`;
 const NAV = () => [['dash', 'Dashboard', ''], ['grades', 'Students & Grades', ''], ['lectures', 'Lectures', ''], ['assign', 'Assignments', '', toGrade() || ''], ['exams', 'Exams', ''], ['fb', 'Feedback', ''], ['profile', 'Profile', '']];
 async function reload() { try { await load(); ui.refresh(); } catch (e) { toast(e.message, 1); } }
 const need = (v, m) => { if (!v) { toast(m, 1); return false; } return true; };
 function review(a) { const list = subs[a.id] || [];
  const m = modal(`<h3>${esc(a.title)}: submissions</h3>${list.length ? list.map(s => `<div class="item" data-s="${s.id}"><b>${esc(s.student)}</b> <small>${esc(s.student_id || '')} &middot; ${dt(s.submitted_at)}</small>${s.body ? `<p>${esc(s.body)}</p>` : ''}${s.file_path ? `<p><button class="btn s g" data-file="${esc(s.file_path)}">Open attached file</button></p>` : ''}<div class="grid" style="margin-top:8px"><input class="in mk" type="number" min="0" ${a.max_score ? `max="${a.max_score}"` : ''} placeholder="Marks${a.max_score ? ' / ' + a.max_score : ''}" value="${s.marks == null ? '' : s.marks}"><input class="in fk" placeholder="Feedback to the student" value="${esc(s.feedback || '')}"></div><div class="row"><button class="btn s sg">${s.graded_at ? 'Update grade' : 'Save grade'}</button></div></div>`).join('') : '<p class="sub">No submissions yet.</p>'}<div class="row"><button class="btn g" id="cl">Close</button></div>`);
  m.querySelector('#cl').onclick = () => m.remove();
  m.querySelectorAll('[data-file]').forEach(b => b.onclick = async () => { const r = await sb.storage.from('submissions').createSignedUrl(b.dataset.file, 600); if (r.error || !r.data) return toast('Could not open that file.', 1); window.open(r.data.signedUrl, '_blank', 'noopener'); });
  m.querySelectorAll('.sg').forEach(b => b.onclick = async () => { const box = b.closest('[data-s]'), v = box.querySelector('.mk').value; if (v === '') return toast('Enter the marks.', 1); b.disabled = true; const r = await sb.rpc('tutor_grade_submission', { p_id: box.dataset.s, p_marks: +v, p_feedback: box.querySelector('.fk').value.trim() || null }); b.disabled = false; if (r.error) return toast(r.error.message, 1); toast('Grade saved.'); await load(); ui.refresh(); }); }
 function questionBlock(prefix){const d=document.createElement('div');d.className='panel qrow';d.innerHTML='<div class="grid"><input class="in qt" placeholder="Question title"><input class="in qo" placeholder="Options separated by | (leave blank for open answer)"><select class="in qm"><option value="false">Mandatory: No</option><option value="true">Mandatory: Yes</option></select><select class="in qf"><option value="false">File required: No</option><option value="true">File required: Yes</option></select><button class="btn s r qdel">Remove</button></div><small class="sub" style="display:block;margin-top:7px">If file is required, the student will be asked for a Google Drive/file link for this question.</small>';d.querySelector('.qdel').onclick=()=>d.remove();return d;}
 function collectQuestions(box){return [...box.querySelectorAll('.qrow')].map(x=>({title:x.querySelector('.qt').value.trim(),options:x.querySelector('.qo').value.split('|').map(v=>v.trim()).filter(Boolean),mandatory:x.querySelector('.qm').value==='true',file_required:x.querySelector('.qf').value==='true'})).filter(x=>x.title);}
 async function importQuestions(file,box){const data=await file.arrayBuffer(),wb=XLSX.read(data,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});rows.forEach(r=>{const q=questionBlock();q.querySelector('.qt').value=String(r.Question||r.question||'').trim();q.querySelector('.qo').value=String(r.Options||r.options||'').trim();q.querySelector('.qm').value=/^yes$/i.test(String(r.Mandatory||r.mandatory||''))?'true':'false';q.querySelector('.qf').value=/^yes$/i.test(String(r['File Required']||r.file_required||r.FileRequired||''))?'true':'false';box.appendChild(q)});}
 function wire(id, M) {
  M.querySelectorAll('[data-course-focus]').forEach(b => b.onclick = () => { F.c = b.dataset.courseFocus; ui('grades'); });
  M.querySelectorAll('[data-go]').forEach(b => b.onclick = () => PCgo(b.dataset.go));
  if (id === 'grades') { const calc=tr=>{const g=k=>Math.max(0,Number(tr.querySelector(`[data-k=${k}]`).value||0)),t=g('attendance')+g('ca')+g('exams');tr.querySelector('.tt').textContent=t;tr.querySelector('.bd').innerHTML=bandPill(band(t));tr.classList.add('chg')};const save=async tr=>{if(tr.dataset.protected==='true'){toast('This result is published or locked. Ask Academic to reopen it for correction.',1);return false}const legacy=tr.dataset.legacy==='true',fields=['attendance','ca','exams'].map(k=>tr.querySelector(`[data-k=${k}]`).value.trim());if(fields.some(v=>v==='')){toast('Enter Attendance, CA and Exams explicitly. Use 0 only when zero is the verified score.',1);return false}if(legacy&&!confirm('Saving will set this result to the current Attendance/CA/Exams model. Confirm all three scores have been checked against the source record before continuing.'))return false;const n=k=>Math.round(Number(tr.querySelector(`[data-k=${k}]`).value||0));const r=await sb.rpc('tutor_save_result',{p_application:tr.dataset.app,p_course:tr.dataset.course,p_attendance:n('attendance'),p_ca:n('ca'),p_exams:n('exams')});if(r.error){toast(r.error.message,1);return false}tr.dataset.legacy='false';tr.classList.remove('chg');return true};M.querySelectorAll('tr[data-app]').forEach(tr=>{tr.querySelectorAll('.sc').forEach(i=>i.oninput=()=>calc(tr));tr.querySelector('.sv').onclick=async e=>{e.target.disabled=true;if(await save(tr)){toast('Saved.');await reload()}e.target.disabled=false}});M.querySelector('#saveAll').onclick=async e=>{const rows=[...M.querySelectorAll('tr.chg')];if(!rows.length)return toast('Nothing has changed.',1);e.target.disabled=true;let ok=0;for(const tr of rows)if(await save(tr))ok++;e.target.disabled=false;toast(ok+' result(s) saved.');await reload()};M.querySelector('#fc').onchange=e=>{F.c=e.target.value;ui.refresh()};M.querySelector('#fi').onchange=e=>{F.i=e.target.value;ui.refresh()};M.querySelector('#bulkUpload').onclick=async e=>{const f=M.querySelector('#bulkR
