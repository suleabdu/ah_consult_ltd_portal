[functions.admin-register]
verify_jwt = false

[functions.payment-webhook]
verify_jwt = false

[functions.upperlink-webhook]
verify_jwt = false

[functions.sheet-sync]
verify_jwt = true
[functions.document-verify]
verify_jwt = false

# User JWT is verified inside the function via auth.getUser(). Gateway JWT
# checks can reject newer signing-key tokens before request-aware CORS runs.
[functions.document-branding]
verify_jwt = false

# Local Supabase only. For the hosted project, configure the equivalent setting
# in Supabase Dashboard > Authentication > Providers > Email > Confirm Email OFF.
# With confirmations disabled, signUp returns a session and applicants enter
# their application portal immediately. Do not bypass provider auth tokens.
[auth.email]
enable_confirmations = false
