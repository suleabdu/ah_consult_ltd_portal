[functions.admin-register]
verify_jwt = false

[functions.payment-webhook]
verify_jwt = false

[functions.upperlink-webhook]
verify_jwt = false

[functions.sheet-sync]
verify_jwt = true
[functions.document-verify]
verify_jwt = false

# User JWT is verified inside the function via auth.getUser(). Gateway JWT
# checks can reject newer signing-key tokens before request-aware CORS runs.
[functions.document-branding]
verify_jwt = false

# Both endpoints validate their own request context: the administration endpoint
# checks the browser session and staff role; the webhook validates Meta's HMAC.
[functions.admin-communications]
verify_jwt = false

[functions.whatsapp-webhook]
verify_jwt = false

# Require ownership of the supplied email address before an applicant receives a
# session. Mirror this setting in Supabase Dashboard > Authentication > Providers
# > Email for every hosted environment, with a verified SMTP sender configured.
[auth.email]
enable_confirmations = true

# The browser Auth access token is checked inside this function, with request-aware CORS.
[functions.admin-bulk-import]
verify_jwt = false
